<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Memes</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      /* Фон: слева тёмный, справа оранжевый — как на фото */
      background: linear-gradient(90deg, #1e1e28 50%, #ff6a00 50%);
    }

    /* Шапка */
    header {
      background-color: #26262e;
      padding: 24px 0;
      text-align: center;
      border-bottom: 4px solid #ff6a00;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 3rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .logo-box {
      background-color: #ff6a00;
      color: #000;
      padding: 4px 20px;
      border-radius: 10px;
    }

    /* Ряд карточек */
    .meme-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 60px 20px 0 20px;
      flex-wrap: wrap;
    }

    .meme-card {
      width: 430px;
      min-height: 240px;
      background-color: #2a2a2a;
      border: 2px solid #ffa726;
      border-radius: 10px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.45);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .meme-card img {
      width: 230px;
      height: 290px;
      object-fit: contain;
    }

    .caption {
      margin: 0;
      text-align: center;
      font-size: 17px;
      line-height: 1.35;
      color: #f0f0f0;
    }

    /* Кнопки по центру внизу */
    .buttons {
      margin-top: auto;
      padding: 40px 0 30px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    .btn {
      background-color: #ff9d2e;
      color: #000;
      border: none;
      font-family: Impact, 'Arial Black', Arial, sans-serif;
      font-size: 20px;
      letter-spacing: 1px;
      padding: 14px 40px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
      transition: transform 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    /* Подвал */
    footer {
      text-align: center;
      padding: 16px;
      font-size: 14px;
      color: #cfcfcf;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <span>STUDENT</span>
      <span class="logo-box">MEMES</span>
    </div>
  </header>

  <main>
    <div class="meme-row">
      <div class="meme-card">
        <img src="img/мем1.jpg" alt="Сонный эмодзи">
        <p class="caption">Когда дедлайн завтра, а ты только открыл тетрадь</p>
      </div>
      <div class="meme-card">
        <img src="img/мем2.jpg" alt="Чашка кофе">
        <p class="caption">3-я чашка кофе: «Я всё успею!»</p>
      </div>
      <div class="meme-card">
        <img src="img/мем3.jpg" alt="График прогресса">
        <p class="caption">Прогресс выполнения курсовой: 0% → 90% → 0%</p>
      </div>
      <div class="meme-card">
        <img src="img/мем4.jpg" alt="Академическая шапочка">
        <p class="caption">Когда препод спрашивает: «Вы готовы?»</p>
      </div>
    </div>

    <div class="buttons">
      <button class="btn">ЕЩЁ СТРАДАНИЙ</button>
      <a href="calculator.html" class="btn" style="text-decoration:none; display:inline-block;">КАЛЬКУЛЯТОР</a>
      <a href="game.html" class="btn" style="text-decoration:none; display:inline-block;">ИГРА</a>
    </div>
  </main>

  <footer>
    &copy; 2026 Student Life. Не для сна.
  </footer>

</body>
</html>
